# Render Blueprint for the backend API (free web service, Docker).
# The database lives outside Render (e.g. Neon), so its connection details are asked for on creation.
services:
  - type: web
    name: smartchorestracker-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://smart-chores-tracker.vercel.app
      - key: APP_TIME_ZONE
        value: Europe/Istanbul
